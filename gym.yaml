apiVersion: apps/v1
kind: Deployment
metadata:
  name: gym-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gym-web
  template:
    metadata:
      labels:
        app: gym-web
    spec:
      containers:
        - name: gym-web
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: website
              mountPath: /usr/share/nginx/html
      volumes:
        - name: website
          configMap:
            name: gym-web-content
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gym-web-content
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Iron Peak Fitness</title>
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; font: 16px Arial, sans-serif; color: #f4f4f4; background: #111; }
        header { padding: 22px 8%; display: flex; justify-content: space-between; background: #191919; }
        .brand { color: #b7f34a; font-weight: 800; font-size: 1.3rem; }
        nav a { color: #eee; margin-left: 20px; text-decoration: none; }
        .hero { min-height: 440px; padding: 100px 8%; background: linear-gradient(90deg, #111 5%, #111b 55%, #1114), linear-gradient(135deg, #343c24, #171717); }
        .hero h1 { max-width: 650px; margin: 0; font-size: clamp(2.5rem, 7vw, 5rem); line-height: 1; }
        .hero p { max-width: 520px; color: #ccc; line-height: 1.6; }
        .button { display: inline-block; padding: 14px 22px; background: #b7f34a; color: #111; font-weight: bold; text-decoration: none; border-radius: 4px; }
        section { padding: 55px 8%; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 18px; }
        .card { background: #202020; padding: 24px; border-radius: 8px; }
        .card h3 { color: #b7f34a; }
        .muted { color: #bbb; line-height: 1.6; }
        footer { padding: 25px 8%; color: #aaa; background: #191919; }
      </style>
    </head>
    <body>
      <header>
        <div class="brand">IRON PEAK FITNESS</div>
        <nav><a href="#programs">Programs</a><a href="#visit">Visit us</a></nav>
      </header>
      <main>
        <div class="hero">
          <h1>Build strength.<br>Find your peak.</h1>
          <p>Good coaching, great equipment, and a welcoming community. Start training at Iron Peak Fitness.</p>
          <a class="button" href="#visit">Plan your first visit</a>
        </div>
        <section id="programs">
          <h2>Training for every goal</h2>
          <div class="cards">
            <article class="card"><h3>Strength</h3><p class="muted">Racks, free weights, and coaching to help you build confidence and progress safely.</p></article>
            <article class="card"><h3>Conditioning</h3><p class="muted">Improve your stamina with guided circuits, cardio equipment, and small-group sessions.</p></article>
            <article class="card"><h3>Personal training</h3><p class="muted">One-to-one support with a plan shaped around your experience and goals.</p></article>
          </div>
        </section>
        <section id="visit">
          <h2>Your first session starts here</h2>
          <p class="muted">Visit us Monday–Saturday, 6:00 AM–10:00 PM. Ask our team about a free introductory session.</p>
          <a class="button" href="mailto:hello@ironpeak.example">Contact the gym</a>
        </section>
      </main>
      <footer>IRON PEAK FITNESS · Train at your own pace.</footer>
    </body>
    </html>
---
apiVersion: v1
kind: Service
metadata:
  name: gym-web
spec:
  type: LoadBalancer
  selector:
    app: gym-web
  ports:
    - port: 80
      targetPort: 80
